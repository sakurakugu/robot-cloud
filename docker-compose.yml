services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robotdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robotdog}
      POSTGRES_DB: ${POSTGRES_DB:-robotdog}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robotdog} -d ${POSTGRES_DB:-robotdog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./后端
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-9000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-./data/logs}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-robotdog}
      DB_USER: ${POSTGRES_USER:-robotdog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-robotdog}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-100}
      WS_ROBOT_PATH: ${WS_ROBOT_PATH:-/api/v1/robot}
      WS_PHONE_PATH: ${WS_PHONE_PATH:-/api/v1/phone}
      WS_WEB_PATH: ${WS_WEB_PATH:-/api/v1/web}
      MEDIA_STREAM_PATH_PREFIX: ${MEDIA_STREAM_PATH_PREFIX:-robots}
      MEDIA_WHEP_BASE_URL: ${MEDIA_WHEP_BASE_URL:-/media}
      FORCE_CONSOLE_LOGS: "1"
    volumes:
      - ./后端/data:/app/data
    expose:
      - "${BACKEND_PORT:-9000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + '/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./前端
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  mediamtx:
    image: bluenviron/mediamtx:1.15.2
    restart: unless-stopped
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_PUBLIC_HOST:-106.53.174.61}
      MTX_WEBRTCLOCALTCPADDRESS: :8189
      MTX_WEBRTCICESERVERS2_0_URL: turn:${MEDIA_TURN_DOMAIN:-106.53.174.61}:${MEDIA_TURN_PORT:-3478}?transport=udp
      MTX_WEBRTCICESERVERS2_0_USERNAME: AUTH_SECRET
      MTX_WEBRTCICESERVERS2_0_PASSWORD: ${MEDIA_TURN_SECRET:-robotdog-turn-secret}
      MTX_WEBRTCICESERVERS2_0_CLIENTONLY: "true"
      MTX_WEBRTCICESERVERS2_1_URL: turn:${MEDIA_TURN_DOMAIN:-106.53.174.61}:${MEDIA_TURN_PORT:-3478}?transport=tcp
      MTX_WEBRTCICESERVERS2_1_USERNAME: AUTH_SECRET
      MTX_WEBRTCICESERVERS2_1_PASSWORD: ${MEDIA_TURN_SECRET:-robotdog-turn-secret}
      MTX_WEBRTCICESERVERS2_1_CLIENTONLY: "true"
      MTX_AUTHMETHOD: internal
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: ~^${MEDIA_STREAM_PATH_PREFIX:-robots}/.+$
      MTX_AUTHINTERNALUSERS_1_USER: ${MEDIA_PUBLISH_USER:-robotdog}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIA_PUBLISH_PASS:-robotdog}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: ~^${MEDIA_STREAM_PATH_PREFIX:-robots}/.+$
    expose:
      - "8889"
    ports:
      - "127.0.0.1:${MEDIA_WHEP_HTTP_PORT:-8889}:8889"
      - "${MEDIA_RTSP_PORT:-8554}:8554"
      - "${MEDIA_WEBRTC_PORT:-8189}:8189/tcp"
      - "${MEDIA_WEBRTC_PORT:-8189}:8189/udp"

  coturn:
    image: coturn/coturn:4.6.3-r0
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${MEDIA_TURN_DOMAIN:-106.53.174.61}
      - --static-auth-secret=${MEDIA_TURN_SECRET:-robotdog-turn-secret}
      - --external-ip=${MEDIA_TURN_EXTERNAL_IP:-106.53.174.61}
      - --min-port=${MEDIA_TURN_RELAY_PORT_MIN:-49160}
      - --max-port=${MEDIA_TURN_RELAY_PORT_MAX:-49200}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${MEDIA_TURN_PORT:-3478}:3478/tcp"
      - "${MEDIA_TURN_PORT:-3478}:3478/udp"
      - "${MEDIA_TURN_RELAY_PORT_MIN:-49160}-${MEDIA_TURN_RELAY_PORT_MAX:-49200}:${MEDIA_TURN_RELAY_PORT_MIN:-49160}-${MEDIA_TURN_RELAY_PORT_MAX:-49200}/tcp"
      - "${MEDIA_TURN_RELAY_PORT_MIN:-49160}-${MEDIA_TURN_RELAY_PORT_MAX:-49200}:${MEDIA_TURN_RELAY_PORT_MIN:-49160}-${MEDIA_TURN_RELAY_PORT_MAX:-49200}/udp"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      mediamtx:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      BACKEND_UPSTREAM: backend:${BACKEND_PORT:-9000}
      FRONTEND_UPSTREAM: frontend:80
      MEDIA_UPSTREAM: mediamtx:8889
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro

volumes:
  pgdata:
